[package]
name = "ommata"
version = "0.5.2"
edition = "2024"
description = "Fast unified image and video viewer with crop and trim"
license = "GPL-3.0-or-later"

# `cargo release patch|minor|major --execute`: bump the version, date the
# changelog, commit, tag vX.Y.Z and push. The tag builds the AppImage.
[package.metadata.release]
publish = false
allow-branch = ["main"]
pre-release-commit-message = "Release {{version}}"
tag-message = "Ommata {{version}}"
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  { file = "CHANGELOG.md", search = "\\[Unreleased\\]: .*", replace = "[Unreleased]: https://github.com/mmzim05/Ommata/compare/{{tag_name}}...HEAD\n[{{version}}]: https://github.com/mmzim05/Ommata/releases/tag/{{tag_name}}", exactly = 1 },
]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "accesskit"] }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }
cpal = "0.18"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
trash = "5"
rawler = "0.8.0"
# Loads libEGL at runtime for zero-copy video (src/gpu.rs); already used by glutin.
libloading = "0.8"
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
quick-xml = "0.41"
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }

[features]
# Link the minimal FFmpeg from scripts/build-ffmpeg.sh statically (single binary).
# For development against the system FFmpeg: FFMPEG_DIR=/usr cargo run --no-default-features
default = ["static"]
static = ["ffmpeg-next/static"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Pixel loops (decode, crop, rotate) stay usable in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
