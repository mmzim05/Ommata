name: Feature request
description: Suggest something Omalens should do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Omalens to do?
      placeholder: Show the photo's EXIF details (camera, lens, exposure).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: What are you trying to get done? This helps find the simplest way to do it.
