# Build the AppImage on every v* tag and attach it to that tag's release.
# Ubuntu 22.04 keeps the AppImage's glibc requirement low, so it runs on
# most current distros.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm meson ninja-build pkg-config clang libclang-dev \
            libva-dev libdrm-dev libx264-dev libx265-dev libasound2-dev file

      - uses: dtolnay/rust-toolchain@stable

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: omalens-appimage
          path: target/appimage/*.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/appimage/*.AppImage
